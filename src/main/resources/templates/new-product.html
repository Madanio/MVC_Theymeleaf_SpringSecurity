<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="layout1">
<body>
<div layout:fragment="content">
    <form method="post" th:action="@{/admin/saveProduct}" class="m-3">
        <h4 th:text="${product.id == null} ? 'New Product' : 'Edit Product #' + ${product.id}"></h4>
        <!-- id caché : vide pour un ajout, rempli pour une édition (save() fait alors un update) -->
        <input type="hidden" name="id" th:value="${product.id}">
        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" name="name" class="form-control" th:value="${product.name}">
            <span class="text-danger" th:errors="${product.name}"></span>
        </div>
        <div class="mb-3">
            <label class="form-label">Price</label>
            <input type="text" name="price" class="form-control" th:value="${product.price}">
            <span class="text-danger" th:errors="${product.price}"></span>
        </div>
        <div class="mb-3">
            <label class="form-label">Quantity</label>
            <input type="text" name="quantity" class="form-control" th:value="${product.quantity}">
            <span class="text-danger" th:errors="${product.quantity}"></span>
        </div>
        <button type="submit" class="btn btn-primary">Save</button>
    </form>
</div>
</body>
</html>
