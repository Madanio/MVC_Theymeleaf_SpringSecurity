<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="layout1">
<body>
<div layout:fragment="content">
    <div class="p-3" sec:authorize="hasRole('ADMIN')">
        <a class="btn btn-primary" th:href="@{/admin/newProduct}">New Product</a>
    </div>
    <div class="p-3">
        <form method="get" th:action="@{/user/index}" class="d-flex gap-2 mb-3">
            <input type="text" name="keyword" class="form-control w-auto" placeholder="Rechercher par nom"
                   th:value="${keyword}">
            <button type="submit" class="btn btn-outline-primary">Search</button>
        </form>
        <table class="table">
            <thead>
            <tr>
                <th>ID</th><th>Name</th><th>Price</th><th>Quantity</th>
                <th sec:authorize="hasRole('ADMIN')"></th>
                <th sec:authorize="hasRole('ADMIN')"></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p:${productList}">
                <td th:text="${p.id}"></td>
                <td th:text="${p.name}"></td>
                <td th:text="${p.price}"></td>
                <td th:text="${p.quantity}"></td>
                <td sec:authorize="hasRole('ADMIN')">
                    <form method="post" th:action="@{/admin/delete(id=${p.id})}">
                        <button type="submit" class="btn btn-danger"
                                onclick="return confirm('Êtes-vous sûr de vouloir supprimer ?')">Delete</button>
                    </form>
                </td>
                <td sec:authorize="hasRole('ADMIN')">
                    <a class="btn btn-success" th:href="@{/admin/editProduct(id=${p.id})}">Edit</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
