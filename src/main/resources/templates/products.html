<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="layout1">
<body>
<div layout:fragment="content">
    <div class="p-3">
        <a class="btn btn-primary" th:href="@{/newProduct}">New Product</a>
    </div>
    <div class="p-3">
        <table class="table">
            <thead>
            <tr><th>ID</th><th>Name</th><th>Price</th><th>Quantity</th><th></th></tr>
            </thead>
            <tbody>
            <tr th:each="p:${productList}">
                <td th:text="${p.id}"></td>
                <td th:text="${p.name}"></td>
                <td th:text="${p.price}"></td>
                <td th:text="${p.quantity}"></td>
                <td>
                    <a onclick="return confirm('Êtes-vous sûr de vouloir supprimer ?')"
                       class="btn btn-danger" th:href="@{/delete(id=${p.id})}">Delete</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
